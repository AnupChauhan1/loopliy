# Uses an existing PostgreSQL database. Set DATABASE_URL on the API service
# (Render Dashboard -> loopliii-crm-api -> Environment) to the connection
# string of your existing database, e.g. another Render Postgres instance's
# "External Database URL" or "Internal Database URL".
services:
  - type: web
    name: loopliii-crm-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm ci --prefix apps/api --include=dev && npm run prisma:generate && npm run build:api
    startCommand: npm run prisma:migrate:deploy && npm --prefix apps/api run start:prod
    initialDeployHook: npm run prisma:seed
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: loopliii-crm-web
          property: host
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: CLIENT_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_HR_PASSWORD
        sync: false
      - key: DEMO_EMPLOYEE_PASSWORD
        sync: false
      - key: DEMO_CLIENT_PASSWORD
        sync: false

  - type: web
    name: loopliii-crm-web
    runtime: node
    region: oregon
    plan: free
    rootDir: apps/web
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://loopliii-crm-api.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://loopliii-crm-web.onrender.com
      - key: NEXT_PUBLIC_DEMO_ACCESS_ENABLED
        value: true
      - key: NEXT_PUBLIC_DEMO_ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DEMO_MANAGER_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DEMO_HR_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DEMO_EMPLOYEE_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_DEMO_CLIENT_PASSWORD
        sync: false
