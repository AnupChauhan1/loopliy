<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Offline · LOOPLY CRM</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #111827; background: #f8fafc; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e5e7eb; border-radius: 24px; background: white; text-align: center; box-shadow: 0 20px 60px -32px #0b1220; }
      img { width: 64px; height: 64px; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { margin: 0; color: #6b7280; }
      button { min-height: 44px; margin-top: 24px; padding: 0 20px; border: 0; border-radius: 12px; color: white; background: #007f5f; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="">
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to continue working in LOOPLY CRM.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
